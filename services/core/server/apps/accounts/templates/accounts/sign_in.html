{% extends "site/layout.html" %}
{% load i18n %}
{% block title %}{% translate "Sign in" %}{% endblock title %}
{% block content %}
  <h1 class="ds-heading mb-6">{% translate "Sign in" %}</h1>
  <form method="post" class="ds-card grid max-w-md gap-4">
    {% csrf_token %}
    {% if form.errors %}
      <p class="ds-alert" role="alert">
        {% translate "Please enter a correct e-mail and password." %}
      </p>
    {% endif %}
    <label class="ds-field">
      {% translate "E-mail" %}
      <input
        type="email"
        name="username"
        value="{{ form.username.value|default:'' }}"
        class="ds-input"
        autocomplete="username"
        required
      >
    </label>
    <label class="ds-field">
      {% translate "Password" %}
      <input
        type="password"
        name="password"
        class="ds-input"
        autocomplete="current-password"
        required
      >
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="ds-button justify-self-start">
      {% translate "Sign in" %}
    </button>
  </form>
{% endblock content %}
