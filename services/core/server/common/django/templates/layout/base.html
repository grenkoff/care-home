{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="{{ theme }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {% block title %}{{ site_name }}{% endblock title %}
    </title>
    <link
      rel="icon"
      href="{% static 'site/favicon.svg' %}"
      type="image/svg+xml"
    >
    <link rel="stylesheet" href="{% static 'site/site.css' %}">
    {% block scripts %}{% endblock scripts %}
  </head>
  <body class="flex min-h-screen flex-col">
    <header class="ds-header">
      <nav class="ds-container flex items-center justify-between py-4">
        <a
          href="/"
          class="font-heading text-xl font-semibold"
        >{{ site_name }}</a>
        <form
          action="{% url 'set_language' %}"
          method="post"
          class="flex items-center gap-2 text-sm"
        >
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <label class="flex items-center gap-2">
            <span>{% translate "Language" %}</span>
            <select name="language" class="ds-input py-1">
              {% get_language_info_list for LANGUAGES as languages %}
              {% for language in languages %}
                {% if language.code == LANGUAGE_CODE %}
                  <option value="{{ language.code }}" selected>
                    {{ language.name_local }}
                  </option>
                {% else %}
                  <option value="{{ language.code }}">
                    {{ language.name_local }}
                  </option>
                {% endif %}
              {% endfor %}
            </select>
          </label>
          <button type="submit" class="ds-button-quiet">
            {% translate "Switch" %}
          </button>
        </form>
      </nav>
    </header>
    <main class="ds-container flex-1 py-8">
      {% block content %}{% endblock content %}
    </main>
    <footer class="ds-footer">
      <p class="ds-container py-6">{{ site_name }}</p>
    </footer>
  </body>
</html>
